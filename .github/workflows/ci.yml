name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Test
        run: |
          swift --version
          swift test

      - name: Build
        run: |
          ./build.sh --universal
          build/lidless version

      - name: Check shell scripts
        run: |
          sh -n install.sh
          bash -n build.sh

  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Tap by URL so trust matches it, then overlay this commit's formula so a
      # pull request is audited against its own changes.
      - name: Tap
        run: |
          brew trust --tap https://github.com/${{ github.repository }}
          brew tap ${{ github.repository }} https://github.com/${{ github.repository }}
          cp Formula/lidless.rb "$(brew --repository ${{ github.repository }})/Formula/lidless.rb"

      - name: Audit
        run: brew audit --strict --formula ${{ github.repository }}/lidless

      # Downloads the release the formula pins, so a wrong url or sha256 fails here.
      - name: Install and test
        run: |
          brew install ${{ github.repository }}/lidless
          brew test ${{ github.repository }}/lidless
