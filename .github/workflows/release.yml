name: Release

# A pushed v* tag builds lidless for Apple Silicon and Intel and publishes it
# as a GitHub Release, which install.sh and the formula download.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write      # to create the release
      id-token: write      # to sign the provenance attestation
      attestations: write  # to store it
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Version matches the tag
        run: |
          version="$(sed -n 's/^let version = "\(.*\)"$/\1/p' Sources/Lidless/Support.swift)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Support.swift says $version, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Test
        run: swift test

      - name: Build
        run: |
          ./build.sh --universal
          lipo -archs build/lidless | grep -q arm64
          lipo -archs build/lidless | grep -q x86_64

      - name: Package
        run: |
          tar -czf lidless-macos.tar.gz -C build lidless
          shasum -a 256 lidless-macos.tar.gz > lidless-macos.tar.gz.sha256
          cat lidless-macos.tar.gz.sha256

      # The checksum sits in the same release as the tarball, so it only catches
      # a corrupt download. The attestation ties the tarball to this workflow
      # and commit: `gh attestation verify` checks it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: lidless-macos.tar.gz

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^### " v "( |$)" { on = 1; next }
            on && /^##/ { exit }
            on { print }
          ' README.md > notes.md
          [ -s notes.md ] || { echo "no Changelog entry for $version in README.md"; exit 1; }
          cat >> notes.md <<'EOF'

          ### Install or upgrade

          ```
          curl -fsSL https://raw.githubusercontent.com/np25071984/lidless/main/install.sh | sh
          ```
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            lidless-macos.tar.gz lidless-macos.tar.gz.sha256 \
            --title "lidless ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
